{% extends "base.html" %}

{% block header %}
    <title>admin product</title>
{% endblock %}
{% block body %}

    <table>
        <tr>
            <th>عکس</th>
            <th>نام</th>
            <th>قیمت</th>
            <th>توضیحات</th>
            <th>فعال</th>
            <th>ویرایش</th>
        </tr>
        {% for p in products %}
            <tr>
                <td><img style="width: 20px;" src="/static/cover/{{ p.id }}.jpg"></td>
                <td>{{ p.name }}</td>
                <td>{{ p.price }}</td>
                <td>{{ p.description }}</td>
                <td>{{ "Yes" if p.active == 1 else "No" }}</td>
                <td><a href="/admin/dashboard/edit-product/{{ p.id }}">ویرایش</a></td>
            </tr>
        {% endfor %}
    </table>

    <hr>
    
    <form action="#" method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" name="name" placeholder="نام محصول"><br>
        <input type="number" name="price" placeholder="قیمت محصول"><br>
        <textarea name="description" placeholder="توضیحات"></textarea><br>
        <label for="file">کاور: </label><input type="file" name="cover" id="file"><br>
        <label for="check">فعال: </label><input type="checkbox" name="active" id="check" value="1"><br>
        <input type="submit">
    </form>
{% endblock %}
