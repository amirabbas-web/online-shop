{% extends "base.html" %}

{% block header %}
    <title>محصول {{ p.name }}</title>
{% endblock %}
{% block body %}
<img style="width: 300px;" src="/static/cover/{{ p.id }}.jpg"><br>
    {{ p.id }}<br>
    {{ p.name }}<br>
    {{ p.price }}<br>
    <form action="{{ url_for('user_blueprint.add_to_cart') }}" method="get">
        <input type="hidden" name="id" value="{{ p.id }}">
        <input type="submit" value="اضافه کردن به سبد خرید">
    </form>
{% endblock %}
